name: Bug report
description: Something on kagelin.app (the homepage/waitlist) isn't working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Check first
      options:
        - label: I searched existing issues and didn't find this already reported.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page / URL
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
    validations:
      required: false
