name: Feature / content suggestion
description: Suggest something for the homepage, waitlist flow, or site content.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Check first
      options:
        - label: I searched existing issues and didn't find this already suggested.
          required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you want to see?
    validations:
      required: true
